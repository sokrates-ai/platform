[tool.ruff]
lint.ignore = ["E501", "E712"]

[tool.poetry]
authors = ["Badr B. (swve)"]
description = "Learnhouse Backend"
name = "learnhouse-api"
package-mode = false
readme = "README.md"
version = "0.1.0"

[tool.poetry.dependencies]
beautifulsoup4 = "^4.12.3"
faker = "^30.1.0"
fastapi = "^0.115.0"
fastapi-jwt-auth = "^0.5.0"
httpx = "^0.28.1"
lxml = "^5.2.1"
psycopg2-binary = "^2.9.9"
pydantic = {version = ">=1.8.0,<2.0.0", extras = ["email"]}
python = "^3.12"
python-dotenv = "^1.0.0"
python-jose = "^3.3.0"
python-multipart = "^0.0.9"
pyyaml = "^6.0.1"
redis = "^5.0.7"
requests = "^2.32.3"
resend = "^2.4.0"
sqlmodel = "^0.0.19"
uvicorn = "0.30.1"
typer = "^0.12.5"
chromadb = "0.5.16"
alembic = "^1.13.2"
alembic-postgresql-enum = "^1.2.0"
sqlalchemy-utils = "^0.41.2"
stripe = "^11.1.1"
prometheus-client = "^0.22.1"
passlib = "^1.7.4"
openai = "^1.107.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
ruff = "^0.11.7"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
