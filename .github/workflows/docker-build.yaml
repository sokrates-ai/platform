name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["API-LINT"]
    types:
      - completed
    # branches:
    #   - PROD_REAL

permissions:
  contents: read
  packages: write

# github.event.workflow_run.conclusion == 'success' &&
jobs:
  build-and-push:
    if: >
      github.event.workflow_run.head_branch == 'PROD_REAL'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sk-platform:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sk-platform:latest
