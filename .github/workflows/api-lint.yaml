name: API-LINT

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Ruff lint
        uses: chartboost/ruff-action@v1
        with:
          src: "./apps/api"
