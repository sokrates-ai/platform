name: API-LINT
on:
  workflow_run:
    workflows: ["WEB-LINT"]
    types:
      - completed
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Ruff lint
        uses: chartboost/ruff-action@v1
        with:
          src: "./apps/api"
