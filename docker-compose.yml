services:
    sk-platform-frontend:
      container_name: sk-platform-frontend
      image: ghcr.io/sokrates-ai/sk-platform-frontend:staging
      ports:
        - "8001:3000"
      env_file:
        - platform-secrets.env
      environment:
        # External reachability config
        - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=sokrates.ae.org
        - SK_PUBLIC_URL=https://app.sokrates.ae.org
        - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=app.sokrates.ae.org
        - LEARNHOUSE_COOKIE_DOMAIN=.sokrates.ae.org

        - NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG=false
        - NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG=default

        - TODO_BACKEND=1
      depends_on:
        - sk-platform-backend

    sk-platform-backend:
      container_name: sk-platform-backend
      image: ghcr.io/sokrates-ai/sk-platform-backend:staging
      ports:
        - "8000:1338"
      volumes:
        - ./learnhouse_data:/usr/learnhouse
        - ./learnhouse_content:/app/api/content
      env_file:
        - platform-secrets.env
      environment:
        # External reachability config
        - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=sokrates.ae.org
        - SK_PUBLIC_URL=https://app.sokrates.ae.org
        - NEXT_PUBLIC_LEARNHOUSE_TOP_DOMAIN=app.sokrates.ae.org
        - LEARNHOUSE_COOKIE_DOMAIN=.sokrates.ae.org

        - NEXT_PUBLIC_LEARNHOUSE_MULTI_ORG=false
        - NEXT_PUBLIC_LEARNHOUSE_DEFAULT_ORG=default

        # Databases
        - LEARNHOUSE_SQL_CONNECTION_STRING=postgresql://learnhouse:learnhouse@sk-platform-postgres:5432/learnhouse
        - LEARNHOUSE_REDIS_CONNECTION_STRING=redis://sk-platform-redis:6379/0
        - LEARNHOUSE_CHROMADB_HOST=sk-platform-chroma
        - LEARNHOUSE_WORKSPACE_REDIS_URL=redis://sk-platform-redis:6379/0
        - LEARNHOUSE_WORKSPACE_COLLAB_BRIDGE_URL=http://sk-platform-collab:81

      depends_on:
        sk-platform-postgres:
          condition: service_healthy
        sk-platform-redis:
          condition: service_healthy

    sk-platform-collab:
      container_name: sk-platform-collab
      build:
        context: ./apps/collab
      restart: unless-stopped
      ports:
        - "6003:80"
      env_file:
        - platform-secrets.env
      environment:
        - NODE_ENV=production
        - LOG_LEVEL=debug
        - LOG_PRETTY=true
        - COLLAB_WS_PORT=80
        - COLLAB_BRIDGE_PORT=81
        - COLLAB_BIND_ADDRESS=0.0.0.0
        - COLLAB_INSTANCE_NAME=collab-local
        - COLLAB_REDIS_HOST=sk-platform-redis
        - COLLAB_REDIS_PORT=6379
        - "COLLAB_REDIS_PREFIX=collab:"
        - "COLLAB_PERSIST_PREFIX=y:doc:"
        - COLLAB_API_BASE_URL=http://sk-platform-backend:1338/api
        - COLLAB_STORE_DEBOUNCE_MS=3000
        - COLLAB_STORE_MAX_DEBOUNCE_MS=15000
        - COLLAB_DIRECT_CONN_IDLE_MS=1500
        - COLLAB_BODY_LIMIT_BYTES=1048576
      depends_on:
        sk-platform-redis:
          condition: service_healthy
        sk-platform-backend:
          condition: service_started

    sk-platform-lsp:
      container_name: sk-platform-lsp
      build:
        context: ./apps/lsp
      restart: unless-stopped
      ports:
        - "3011:3011"
      environment:
        - LSP_PROXY_PORT=3011

    sk-platform-postgres:
      container_name: sk-platform-postgres
      image: docker.io/postgres:16-alpine
      restart: always
      environment:
        - POSTGRES_USER=learnhouse
        - POSTGRES_PASSWORD=
        - POSTGRES_DB=learnhouse
      volumes:
        - ./platform_postgres:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U learnhouse"]
        interval: 5s
        timeout: 4s
        retries: 5

    sk-platform-redis:
      container_name: sk-platform-redis
      image: docker.io/redis:latest
      restart: always
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 4s
        retries: 5
      volumes:
          - ./platform_redis:/data

    sk-platform-chroma:
      container_name: sk-platform-chroma
      image: docker.io/chromadb/chroma:0.5.16
